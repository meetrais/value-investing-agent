[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "value-investing-agent"
version = "0.1.0"
description = "Google ADK and Gemini agent for search-grounded value investing research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.18,<3",
    "google-genai>=1.45,<3",
    "python-dotenv>=1.0,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "httpx>=0.27,<1"]

[project.scripts]
value-investing-agent = "value_investing_agent.web:main"
value-investing-agent-cli = "value_investing_agent.cli:main"

[tool.setuptools.package-data]
value_investing_agent = ["static/*"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["value_investing_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: opt-in Gemini API test (uses API quota)"]

[tool.ruff]
target-version = "py311"
line-length = 100
